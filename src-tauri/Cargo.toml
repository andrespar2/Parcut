[package]
name = "parcut"
version = "1.2.0"
description = "ParCut — divide y publica videos en clips"
authors = ["andrespar2"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "parcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }
webview2-com = "0.39"
adblock = "0.13.5"
http = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
futures-util = "0.3"
urlencoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
